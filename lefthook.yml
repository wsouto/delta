pre-commit:
  parallel: true # Run typecheck, lint, and tests concurrently to save time
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
    tests:
      run: bun test
    gitleaks:
      run: gitleaks git --staged

commit-msg:
  commands:
    commitlint:
      # Validates commit message against your config
      run: bun x commitlint --edit {1}
