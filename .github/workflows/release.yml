name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-linux-x64:
    name: package Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          PACKAGE_NAME="delta-linux-x64"
          PACKAGE_DIR="dist/${PACKAGE_NAME}"
          ARCHIVE="dist/${PACKAGE_NAME}.tar.gz"
          mkdir -p "$PACKAGE_DIR"
          bun build ./index.ts --compile --target=bun-linux-x64-baseline --outfile "$PACKAGE_DIR/delta"
          cp README.md LICENSE tools.toml "$PACKAGE_DIR/"
          tar -C dist -czf "$ARCHIVE" "$PACKAGE_NAME"

      - name: Upload package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/delta-linux-x64.tar.gz"
          gh release upload "$TAG" "$ARCHIVE" --clobber
